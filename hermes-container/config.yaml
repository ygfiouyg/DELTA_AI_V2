# ═══ Dr. AIX Agent (Hermes) Configuration ═══

model:
  default: "openrouter:auto-select"
  provider: "openrouter"

database:
  journal_mode: "wal"

terminal:
  backend: "local"
  cwd: "/workspace"
  timeout: 180

# ─── Dashboard Auth ───
dashboard:
  basic_auth:
    username: "admin"
    password_hash: "dr-aix-2026"
  bind: "0.0.0.0"
  port: 8000

# ─── General ───
agent:
  max_iterations: 10
  enable_tools: true
  enable_skills: true
  enable_memory: true
  enable_cron: true
