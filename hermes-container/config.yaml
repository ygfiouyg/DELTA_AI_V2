# ═══ Dr. AIX Agent (Hermes) Configuration ═══

model:
  default: "openrouter:auto-select"
  provider: "openrouter"

database:
  journal_mode: "wal"

terminal:
  backend: "local"
  cwd: "/workspace"
  timeout: 180

dashboard:
  bind: "127.0.0.1"
  port: 8000

agent:
  max_iterations: 10
  enable_tools: true
  enable_skills: true
  enable_memory: true
  enable_cron: true
